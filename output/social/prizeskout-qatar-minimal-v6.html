<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PrizeSkout Qatar Minimal Campaign</title>
  <style>
    :root { --navy:#050b18; --orange:#ff6b35; --paper:#f7f2e9; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { font-family:Arial,Helvetica,sans-serif; background:var(--navy); }
    .post { position:relative; width:100%; height:100%; overflow:hidden; background:var(--navy); color:#fff; }
    .portrait { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:57% center; }
    .wash { position:absolute; inset:0; background:linear-gradient(90deg,rgba(5,11,24,.98) 0%,rgba(5,11,24,.88) 35%,rgba(5,11,24,.35) 56%,rgba(5,11,24,.03) 77%); }
    .logo { position:absolute; left:5.8%; top:6%; width:21%; }
    .message { position:absolute; left:5.8%; top:27%; width:46%; }
    h1 { margin:0; color:var(--paper); font-size:7.4vw; line-height:.91; letter-spacing:-.065em; font-weight:760; }
    h1 span { color:var(--orange); }
    p { margin:2vw 0 0; width:94%; color:#fff; font-size:2.05vw; line-height:1.32; font-weight:650; letter-spacing:-.018em; }
    .url { position:absolute; left:5.8%; bottom:6%; padding:.95vw 1.35vw .85vw; background:var(--orange); color:var(--navy); font-size:1.35vw; font-weight:800; }

    body.tiktok .portrait { object-position:58% center; }
    body.tiktok .wash { background:linear-gradient(180deg,rgba(5,11,24,.94) 0%,rgba(5,11,24,.82) 30%,rgba(5,11,24,.32) 51%,rgba(5,11,24,.08) 72%,rgba(5,11,24,.35) 100%); }
    body.tiktok .logo { left:7%; top:5.5%; width:28%; }
    body.tiktok .message { left:7%; top:24%; width:52%; }
    body.tiktok h1 { font-size:11.3vw; line-height:.92; }
    body.tiktok p { margin-top:3vw; width:94%; font-size:3vw; line-height:1.32; }
    body.tiktok .url { left:7%; bottom:7.5%; padding:1.6vw 2.2vw 1.45vw; font-size:2.5vw; }
  </style>
</head>
<body>
  <main class="post">
    <img class="portrait" src="prizeskout-qatar-merchant-portrait-v1.png" alt="Fictional GCC restaurant merchant" />
    <div class="wash"></div>
    <img class="logo" src="../../src/assets/logo-dark.svg" alt="PrizeSkout" />
    <section class="message">
      <h1>Hello,<br /><span>Qatar.</span></h1>
      <p>PrizeSkout is now operating from Qatar. Helping GCC merchants protect margin on every order.</p>
    </section>
    <div class="url">prizeskout.qa</div>
  </main>
  <script>if(new URLSearchParams(location.search).get('format')==='tiktok')document.body.classList.add('tiktok');</script>
</body>
</html>
