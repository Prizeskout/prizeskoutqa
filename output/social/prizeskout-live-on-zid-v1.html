<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PrizeSkout is Live on Zid</title>
  <style>
    :root { --ink:#090624; --orange:#ff6b35; --purple:#5b2b82; --cream:#faf5eb; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { font-family:Arial,Helvetica,sans-serif; background:var(--cream); }
    .post { position:relative; width:100%; height:100%; overflow:hidden; background:var(--cream); color:var(--ink); }
    .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
    .logo { position:absolute; left:4.8%; top:4.7%; width:20%; filter:brightness(0); }
    .zid { position:absolute; right:4.6%; top:4%; padding:1.05vw 1.65vw .9vw; border-radius:2vw; background:#fff; color:var(--purple); font-size:2.1vw; line-height:1; font-weight:850; letter-spacing:-.07em; box-shadow:0 .35vw 1vw rgba(9,6,36,.09); }
    .copy { position:absolute; left:4.8%; top:18%; width:44%; }
    h1 { margin:0; font-size:7.7vw; line-height:.9; letter-spacing:-.07em; font-weight:800; }
    h1 span { color:var(--purple); }
    p { margin:2.1vw 0 0; width:90%; font-size:2.05vw; line-height:1.3; font-weight:650; letter-spacing:-.025em; }
    .cta { position:absolute; left:4.8%; bottom:5%; padding:1.15vw 1.55vw 1vw; background:var(--ink); color:#fff; font-size:1.65vw; font-weight:800; }
    .tablet-ui { position:absolute; left:58.15%; top:45.4%; width:17.9%; height:29.1%; padding:1.05vw .85vw .8vw; border-radius:1.2vw; color:#fff; background:#080d19; transform:rotate(.7deg); overflow:hidden; }
    .tablet-top { display:flex; align-items:center; justify-content:space-between; }
    .tablet-brand { font-size:.78vw; font-weight:800; }
    .tablet-brand b { color:var(--orange); }
    .connected { display:flex; align-items:center; gap:.28vw; color:#aeb5c1; font-size:.42vw; }
    .connected::before { content:""; width:.36vw; height:.36vw; border-radius:50%; background:#20c985; box-shadow:0 0 .45vw rgba(32,201,133,.55); }
    .section-title { margin-top:.85vw; font-size:.5vw; font-weight:700; color:#d6dae1; }
    .metric-label { margin-top:.65vw; color:#aeb5c1; font-size:.54vw; }
    .metric { margin-top:.24vw; font-size:1.28vw; font-weight:800; }
    .metric small { color:var(--orange); font-size:.55vw; }
    .chart { position:absolute; left:.85vw; right:.85vw; top:6vw; height:4.1vw; border-bottom:1px solid rgba(255,255,255,.14); }
    .chart svg { width:100%; height:100%; }
    .stats { position:absolute; left:.85vw; right:.85vw; bottom:.8vw; display:grid; grid-template-columns:repeat(3,1fr); gap:.35vw; }
    .stat { padding:.5vw .42vw; border:1px solid rgba(255,255,255,.12); border-radius:.42vw; background:#141924; }
    .stat span { display:block; color:#929cab; font-size:.36vw; line-height:1.15; }
    .stat strong { display:block; margin-top:.25vw; color:#fff; font-size:.68vw; }

    body.tiktok .photo { inset:auto 0 0; width:100%; height:58%; object-fit:cover; object-position:58% center; }
    body.tiktok .logo { left:7%; top:5%; width:28%; }
    body.tiktok .zid { right:6%; top:4.7%; padding:1.6vw 2.5vw 1.4vw; border-radius:3vw; font-size:3.2vw; }
    body.tiktok .copy { left:7%; top:15%; width:75%; }
    body.tiktok h1 { font-size:12vw; }
    body.tiktok p { margin-top:3vw; width:90%; font-size:3.25vw; }
    body.tiktok .cta { left:7%; bottom:6%; padding:1.8vw 2.4vw 1.6vw; font-size:2.8vw; z-index:3; }
    body.tiktok .tablet-ui { left:58.4%; top:68.2%; bottom:auto; width:22.5%; height:16.2%; padding:1.1vw .8vw; border-radius:1.4vw; }
    body.tiktok .tablet-brand { font-size:.78vw; }
    body.tiktok .connected { font-size:.4vw; }
    body.tiktok .metric-label { margin-top:.55vw; font-size:.5vw; }
    body.tiktok .metric { font-size:1.4vw; }
    body.tiktok .chart { top:5.2vw; height:4vw; }
  </style>
</head>
<body>
  <main class="post">
    <img class="photo" src="prizeskout-zid-merchants-v1.png" alt="Fictional GCC ecommerce merchants" />
    <img class="logo" src="../../src/assets/logo-light.svg" alt="PrizeSkout" />
    <div class="zid">zid</div>
    <section class="copy">
      <h1>We’re live<br />on <span>Zid.</span></h1>
      <p>Zid merchants can now protect margins and price with confidence.</p>
    </section>
    <div class="tablet-ui">
      <div class="tablet-top"><div class="tablet-brand">Prize<b>skout</b></div><div class="connected">Zid store</div></div>
      <div class="section-title">Revenue Protection Center</div>
      <div class="metric-label">Margin protected</div>
      <div class="metric">+18.4% <small>SAR</small></div>
      <div class="chart"><svg viewBox="0 0 100 50" preserveAspectRatio="none"><path d="M0,44 C18,39 22,31 38,34 S61,20 74,24 S87,10 100,6" fill="none" stroke="#ff6b35" stroke-width="3"/><path d="M0,44 C18,39 22,31 38,34 S61,20 74,24 S87,10 100,6 L100,50 L0,50Z" fill="rgba(255,107,53,.18)"/></svg></div>
      <div class="stats">
        <div class="stat"><span>Risks detected</span><strong>12</strong></div>
        <div class="stat"><span>Actions logged</span><strong>47</strong></div>
        <div class="stat"><span>Orders tracked</span><strong>1.2K</strong></div>
      </div>
    </div>
    <div class="cta">Install PrizeSkout →</div>
  </main>
  <script>if(new URLSearchParams(location.search).get('format')==='tiktok')document.body.classList.add('tiktok');</script>
</body>
</html>
