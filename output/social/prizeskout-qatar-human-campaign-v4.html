<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PrizeSkout Qatar Human Campaign</title>
  <style>
    :root { --navy:#050b18; --orange:#ff6b35; --paper:#f4efe6; --maroon:#8a1538; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { font-family:Arial,Helvetica,sans-serif; background:var(--navy); }
    .post { position:relative; width:100%; height:100%; overflow:hidden; background:#8a715c; color:#fff; isolation:isolate; }
    .portrait { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:58% center; z-index:-4; }
    .shade { position:absolute; inset:0; z-index:-3; background:linear-gradient(90deg,rgba(5,11,24,.98) 0%,rgba(5,11,24,.95) 42%,rgba(5,11,24,.56) 57%,rgba(5,11,24,.03) 78%); }
    .panel { position:absolute; left:0; top:0; width:57%; height:100%; z-index:-2; background:var(--navy); clip-path:polygon(0 0,83% 0,100% 50%,83% 100%,0 100%); }
    .maroon-tab { position:absolute; right:0; top:0; width:17%; height:2.2%; background:var(--maroon); }
    .maroon-tab::before { content:""; position:absolute; left:-10%; top:0; border-top:1.1vw solid transparent; border-bottom:1.1vw solid transparent; border-right:1.1vw solid var(--maroon); }
    .logo { position:absolute; left:6.2%; top:5.2%; width:20.5%; }
    .chapter { position:absolute; left:6.2%; top:17.1%; color:#ff8a5f; font-size:1.15vw; font-weight:800; letter-spacing:.19em; text-transform:uppercase; }
    h1 { position:absolute; left:5.9%; top:21.3%; width:48%; margin:0; color:var(--paper); font-size:6.65vw; line-height:.93; letter-spacing:-.065em; font-weight:760; }
    h1 span { color:var(--orange); }
    .intro { position:absolute; left:6.2%; top:40.2%; width:39%; margin:0; color:#d3d8e0; font-size:1.58vw; line-height:1.42; }
    .intro strong { color:#fff; }
    .proof { position:absolute; left:6.2%; top:54.5%; width:39%; overflow:hidden; border-radius:1.25vw; border:1px solid rgba(255,255,255,.17); background:#12151c; box-shadow:0 1.8vw 4vw rgba(0,0,0,.28); }
    .proof img { display:block; width:100%; height:auto; }
    .proof-tag { position:absolute; left:7.7%; top:56.2%; z-index:2; padding:.65vw .8vw; color:#fff; background:rgba(5,11,24,.88); border-left:.28vw solid var(--orange); font-size:.86vw; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    .footer { position:absolute; left:6.2%; bottom:5%; width:41%; display:flex; align-items:flex-end; justify-content:space-between; border-top:1px solid rgba(255,255,255,.24); padding-top:1.45vw; }
    .footer-copy strong { display:block; color:#fff; font-size:1.23vw; }
    .footer-copy span { display:block; margin-top:.48vw; color:#929cab; font-size:.92vw; }
    .url { color:#fff; font-size:1.25vw; font-weight:800; border-bottom:.25vw solid var(--orange); padding-bottom:.4vw; }
    .qatar { position:absolute; right:4.5%; bottom:4.2%; color:#fff; font-size:1.05vw; font-weight:800; letter-spacing:.2em; text-transform:uppercase; text-shadow:0 2px 15px rgba(0,0,0,.55); }

    body.tiktok .portrait { object-position:61% center; }
    body.tiktok .shade { background:linear-gradient(180deg,rgba(5,11,24,.94) 0%,rgba(5,11,24,.88) 39%,rgba(5,11,24,.14) 60%,rgba(5,11,24,.60) 100%); }
    body.tiktok .panel { width:100%; height:48%; clip-path:polygon(0 0,100% 0,100% 74%,0 100%); background:rgba(5,11,24,.94); }
    body.tiktok .maroon-tab { width:26%; height:1.6%; }
    body.tiktok .logo { left:7%; top:6.2%; width:27%; }
    body.tiktok .chapter { left:7%; top:16.5%; font-size:2.1vw; }
    body.tiktok h1 { left:6.8%; top:20.3%; width:78%; font-size:11.2vw; line-height:.92; }
    body.tiktok .intro { left:7%; top:36%; width:78%; font-size:2.65vw; }
    body.tiktok .proof { left:7%; top:67%; width:48%; border-radius:2vw; }
    body.tiktok .proof-tag { left:9%; top:68.1%; padding:1vw 1.25vw; font-size:1.45vw; }
    body.tiktok .footer { left:7%; bottom:7.5%; width:86%; padding-top:2vw; }
    body.tiktok .footer-copy strong { font-size:2.45vw; }
    body.tiktok .footer-copy span { font-size:1.75vw; margin-top:.8vw; }
    body.tiktok .url { font-size:2.35vw; border-bottom-width:.45vw; }
    body.tiktok .qatar { right:5%; bottom:19%; font-size:1.7vw; }
  </style>
</head>
<body>
  <main class="post">
    <img class="portrait" src="prizeskout-qatar-merchant-portrait-v1.png" alt="Fictional GCC restaurant merchant" />
    <div class="shade"></div><div class="panel"></div><div class="maroon-tab"></div>
    <img class="logo" src="../../src/assets/logo-dark.svg" alt="PrizeSkout" />
    <div class="chapter">A new chapter for PrizeSkout</div>
    <h1>Hello,<br /><span>Qatar.</span></h1>
    <p class="intro"><strong>We are now operating from Qatar.</strong><br />Helping GCC merchants protect margin on every order.</p>
    <div class="proof-tag">Live margin visibility</div>
    <figure class="proof"><img src="prizeskout-revenue-dashboard-crop-v1.png" alt="PrizeSkout revenue protection dashboard" /></figure>
    <footer class="footer"><div class="footer-copy"><strong>Built for profitable commerce.</strong><span>Monitor. Detect. Act.</span></div><div class="url">prizeskout.qa</div></footer>
    <div class="qatar">Doha · Qatar</div>
  </main>
  <script>if(new URLSearchParams(location.search).get('format')==='tiktok') document.body.classList.add('tiktok');</script>
</body>
</html>
