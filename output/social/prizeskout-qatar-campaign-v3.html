<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PrizeSkout Qatar Campaign</title>
  <style>
    :root { --navy:#050b18; --paper:#f1ede4; --orange:#ff6b35; --maroon:#8a1538; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { font-family:Arial,Helvetica,sans-serif; background:var(--navy); }
    .post { position:relative; width:100%; height:100%; overflow:hidden; background:var(--paper); color:var(--navy); isolation:isolate; }
    .navy-field { position:absolute; inset:0 0 auto 0; height:66%; background:var(--navy); z-index:-3; }
    .maroon-field { position:absolute; right:0; top:0; width:19%; height:66%; background:var(--maroon); z-index:-2; }
    .teeth { position:absolute; top:0; right:19%; width:5.2%; height:66%; background:var(--maroon); z-index:-2; clip-path:polygon(100% 0,100% 100%,0 95%,100% 90%,0 85%,100% 80%,0 75%,100% 70%,0 65%,100% 60%,0 55%,100% 50%,0 45%,100% 40%,0 35%,100% 30%,0 25%,100% 20%,0 15%,100% 10%,0 5%); }
    .logo { position:absolute; left:6.2%; top:4.7%; width:20%; }
    .place { position:absolute; right:4.5%; top:5.1%; color:#fff; font-size:1.15vw; font-weight:700; letter-spacing:.21em; writing-mode:vertical-rl; }
    .eyebrow { position:absolute; left:6.2%; top:15.4%; color:var(--orange); font-size:1.08vw; font-weight:800; letter-spacing:.19em; text-transform:uppercase; }
    h1 { position:absolute; left:6%; top:19%; width:69%; margin:0; color:#fff; font-size:6.65vw; line-height:.91; letter-spacing:-.065em; font-weight:760; }
    h1 .hello { color:var(--paper); }
    h1 .qatar { color:var(--orange); }
    .intro { position:absolute; left:6.2%; top:39.7%; width:49%; margin:0; color:#cbd1da; font-size:1.62vw; line-height:1.42; }
    .intro strong { color:#fff; }
    .product-card { position:absolute; left:7%; top:51.5%; width:79%; height:39%; overflow:hidden; border-radius:2.1vw; background:#11141b; box-shadow:0 2.5vw 5vw rgba(2,6,14,.30); transform:rotate(-2.2deg); border:.5vw solid var(--paper); }
    .product-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
    .product-card::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); border-radius:1.55vw; pointer-events:none; }
    .stamp { position:absolute; right:6.2%; top:48.2%; width:15.5%; aspect-ratio:1; border-radius:50%; background:var(--orange); color:var(--navy); display:grid; place-items:center; text-align:center; font-size:1.05vw; line-height:1.15; font-weight:800; letter-spacing:.08em; text-transform:uppercase; transform:rotate(8deg); box-shadow:0 1.2vw 2.5vw rgba(0,0,0,.20); z-index:3; }
    .stamp::before { content:""; position:absolute; inset:9%; border:1px solid rgba(5,11,24,.5); border-radius:50%; }
    .bottom { position:absolute; left:6.2%; right:6.2%; bottom:4.6%; display:flex; align-items:flex-end; justify-content:space-between; color:var(--navy); }
    .bottom strong { display:block; font-size:1.45vw; }
    .bottom span { display:block; margin-top:.5vw; color:#596171; font-size:1.03vw; }
    .url { padding:.85vw 1.15vw; border-bottom:.28vw solid var(--orange); font-size:1.35vw; font-weight:800; }
    .micro { position:absolute; right:25.8%; top:11%; width:6.7%; height:1px; background:rgba(255,255,255,.36); }

    /* TikTok/Reels: deliberately re-composed for a 9:16 safe area. */
    body.tiktok .navy-field, body.tiktok .maroon-field, body.tiktok .teeth { height:70%; }
    body.tiktok .maroon-field { width:16%; }
    body.tiktok .teeth { right:16%; width:5%; }
    body.tiktok .logo { left:7%; top:6.5%; width:26%; }
    body.tiktok .place { right:4.3%; top:7%; font-size:2.1vw; }
    body.tiktok .eyebrow { left:7%; top:17%; font-size:2.1vw; }
    body.tiktok h1 { left:6.8%; top:21%; width:75%; font-size:11.6vw; line-height:.92; }
    body.tiktok .intro { left:7%; top:38.5%; width:66%; font-size:2.85vw; }
    body.tiktok .product-card { left:7%; top:51.5%; width:80%; height:27%; border-radius:3vw; border-width:.8vw; transform:rotate(-2deg); }
    body.tiktok .stamp { right:4.5%; top:43.5%; width:17%; font-size:1.55vw; }
    body.tiktok .bottom { left:7%; right:7%; bottom:8%; }
    body.tiktok .bottom strong { font-size:2.8vw; }
    body.tiktok .bottom span { font-size:2vw; margin-top:.8vw; }
    body.tiktok .url { font-size:2.5vw; padding:1.2vw 1.7vw; border-bottom-width:.5vw; }
    body.tiktok .micro { display:none; }
  </style>
</head>
<body>
  <main class="post">
    <div class="navy-field"></div><div class="maroon-field"></div><div class="teeth"></div><div class="micro"></div>
    <img class="logo" src="../../src/assets/logo-dark.svg" alt="PrizeSkout" />
    <div class="place">DOHA · QATAR</div>
    <div class="eyebrow">A new chapter for PrizeSkout</div>
    <h1><span class="hello">Hello,</span><br /><span class="qatar">Qatar.</span></h1>
    <p class="intro"><strong>We are now operating from Qatar.</strong><br />Helping GCC merchants protect margin on every order.</p>
    <figure class="product-card"><img src="prizeskout-revenue-dashboard-crop-v1.png" alt="PrizeSkout revenue protection interface" /></figure>
    <div class="stamp">Every riyal<br />protected</div>
    <footer class="bottom">
      <div><strong>Margin intelligence for GCC merchants.</strong><span>Monitor. Detect. Act.</span></div>
      <div class="url">prizeskout.qa</div>
    </footer>
  </main>
  <script>if(new URLSearchParams(location.search).get('format')==='tiktok') document.body.classList.add('tiktok');</script>
</body>
</html>
