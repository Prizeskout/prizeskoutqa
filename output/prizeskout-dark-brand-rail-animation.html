<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PrizeSkout dark brand rail</title>
  <style>
    :root{--bg:#151412;--line:#3e3934;--text:#f3eee9;--muted:#c7c0b9;--orange:#f75d16}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{height:100vh;max-width:1180px;margin:auto;display:flex;flex-direction:column}.feed{flex:1;min-height:0;overflow-y:auto;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:4px}.input-bar{flex-shrink:0;padding:18px 28px 28px;display:flex;justify-content:center}.demo{width:100%}.kicker{display:flex;align-items:center;gap:12px;color:#b8b1aa;font-size:13px}.kicker:before{content:"";width:28px;height:1px;background:var(--orange)}h1{max-width:820px;margin:18px 0 52px;font-size:clamp(48px,7vw,84px);line-height:.98;letter-spacing:-.055em;font-weight:500}.rail{position:relative;padding:28px 0 10px;overflow:hidden;border-top:1px solid var(--line)}.headline{margin:0 0 28px;color:var(--muted);font-size:18px;text-align:center;opacity:0;transform:translateY(8px)}.running .headline{animation:in .45s ease-out forwards}.brands{position:relative}.brands:before{content:"";position:absolute;z-index:-1;inset:0 auto 0 -26%;width:24%;background:linear-gradient(90deg,transparent,#f75d161c,transparent);transform:skewX(-18deg)}.running .brands:before{animation:sweep 1.05s .2s ease-in-out forwards}.row{margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);list-style:none}.row+.row{border-top:1px solid #ffffff0e}.brand{min-height:66px;padding:12px;display:flex;align-items:center;justify-content:center;gap:10px;border-right:1px solid #ffffff0e;font-size:15px;font-weight:500;opacity:0;transform:translateY(10px)}.brand:nth-child(6){border:0}.running .brand{animation:in .4s calc(.22s + var(--i)*.055s) ease-out forwards}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:var(--c);color:#fff;font-size:12px;font-style:normal;font-weight:700}.mark.dark{color:#17120b}button{min-height:46px;padding:10px 20px;border:1px solid #913c14;border-radius:6px;background:var(--orange);color:#fff;font-size:13px;font-weight:650;cursor:pointer}.replay{display:none}.done .play{display:none}.done .replay{display:block}@keyframes in{to{opacity:1;transform:none}}@keyframes sweep{to{transform:translateX(640%) skewX(-18deg)}}
    @media(max-width:720px){.feed{padding:20px;justify-content:flex-start;padding-top:68px}h1{margin-bottom:38px}.headline{max-width:330px;text-align:left;font-size:15px}.row{grid-template-columns:repeat(2,1fr)}.row+.row{border:0}.brand{min-height:58px;justify-content:flex-start;border-bottom:1px solid #ffffff0e}.brand:nth-child(6){border-bottom:1px solid #ffffff0e}.row:last-child .brand:nth-last-child(-n+2){border-bottom:0}}
    @media(prefers-reduced-motion:reduce){.headline,.brand{opacity:1;transform:none;animation:none!important}.brands:before{display:none}}
  </style>
</head>
<body><main class="app"><div class="feed"><section class="demo"><span class="kicker">Deep-tech commerce infrastructure</span><h1>Know what every order <em>should earn.</em></h1><div class="rail"><p class="headline">Connect your stack. Bring your POS and marketplace data together.</p><div class="brands"><ul class="row"><li class="brand" style="--i:0;--c:#03bcae"><i class="mark">D</i>Deliveroo</li><li class="brand" style="--i:1;--c:#18362e"><i class="mark">C</i>Careem</li><li class="brand" style="--i:2;--c:#19ac70"><i class="mark">M</i>Mrsool</li><li class="brand" style="--i:3;--c:#8d4be8"><i class="mark">Z</i>Zid</li><li class="brand" style="--i:4;--c:#05817c"><i class="mark">S</i>Salla</li><li class="brand" style="--i:5;--c:#5735bc"><i class="mark">F</i>Foodics</li></ul><ul class="row"><li class="brand" style="--i:6;--c:#ef5a18"><i class="mark">t</i>Talabat</li><li class="brand" style="--i:7;--c:#dc0b22"><i class="mark">S</i>Snoonu</li><li class="brand" style="--i:8;--c:#8161d7"><i class="mark">J</i>Jahez</li><li class="brand" style="--i:9;--c:#7a19d3"><i class="mark">R</i>Rafeeq</li><li class="brand" style="--i:10;--c:#f2c900"><i class="mark dark">K</i>Keeta</li><li class="brand" style="--i:11;--c:#e8cf08"><i class="mark dark">H</i>HungerStation</li></ul></div></div></section></div><div class="input-bar"><button class="play">Reveal brands</button><button class="replay">Replay</button></div></main><script>const app=document.querySelector('.app'),play=document.querySelector('.play'),replay=document.querySelector('.replay');function run(){app.classList.remove('done');app.classList.add('running');play.disabled=true;setTimeout(()=>{app.classList.add('done');play.disabled=false},1200)}function again(){app.classList.remove('running','done');void app.offsetWidth;run()}play.addEventListener('click',run);replay.addEventListener('click',again);</script></body>
</html>
