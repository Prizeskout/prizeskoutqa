<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1128, initial-scale=1" />
    <title>PrizeSkout LinkedIn Cover</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1128px; height: 191px; overflow: hidden; }
      body {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #f8fafc;
        background: #050b16;
      }
      .cover {
        position: relative;
        width: 1128px;
        height: 191px;
        overflow: hidden;
        isolation: isolate;
        background: #050b16;
      }
      .texture {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: .58;
        filter: saturate(.78) contrast(.96) brightness(.82);
        z-index: -3;
      }
      .wash {
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(90deg, rgba(4,9,20,.98) 0%, rgba(4,9,20,.88) 47%, rgba(4,9,20,.62) 72%, rgba(4,9,20,.34) 100%),
          linear-gradient(180deg, rgba(4,9,20,.22), rgba(4,9,20,.54));
      }
      .edge {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        background: #ff6b35;
      }
      .brand {
        position: absolute;
        left: 330px;
        top: 26px;
        width: 146px;
        height: auto;
      }
      .copy {
        position: absolute;
        left: 330px;
        top: 77px;
      }
      h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.08;
        letter-spacing: -0.8px;
        font-weight: 680;
      }
      h1 span { color: #ff6b35; }
      .promise {
        margin: 10px 0 0;
        color: #bac2ce;
        font-size: 14px;
        line-height: 1;
        letter-spacing: .1px;
      }
      .products {
        position: absolute;
        right: 48px;
        top: 37px;
        width: 228px;
        padding-left: 20px;
        border-left: 1px solid rgba(255,107,53,.55);
      }
      .product + .product {
        margin-top: 23px;
      }
      .label {
        display: block;
        margin-bottom: 4px;
        color: #ff6b35;
        font-size: 9px;
        line-height: 1;
        font-weight: 760;
        letter-spacing: 1.35px;
        text-transform: uppercase;
      }
      .product.secondary .label { color: #9099a7; }
      .url {
        color: #f8fafc;
        font-size: 16px;
        line-height: 1;
        font-weight: 590;
        letter-spacing: -.15px;
      }
      .fine-line {
        position: absolute;
        right: 293px;
        top: 31px;
        width: 28px;
        height: 1px;
        background: #ff6b35;
        opacity: .9;
      }
    </style>
  </head>
  <body>
    <main class="cover" aria-label="PrizeSkout LinkedIn cover">
      <img class="texture" src="prizeskout-linkedin-cover-background-v1.png" alt="" />
      <div class="wash"></div>
      <div class="edge"></div>
      <img class="brand" src="../../src/assets/logo-dark.svg" alt="PrizeSkout" />
      <section class="copy">
        <h1>Commerce intelligence<br />for <span>merchants</span> and shoppers.</h1>
        <p class="promise">Protect margins. Shop smarter.</p>
      </section>
      <div class="fine-line"></div>
      <aside class="products" aria-label="PrizeSkout products">
        <div class="product">
          <span class="label">For merchants</span>
          <span class="url">prizeskout.qa</span>
        </div>
        <div class="product secondary">
          <span class="label">For shoppers</span>
          <span class="url">prizeskout.com</span>
        </div>
      </aside>
    </main>
  </body>
</html>
