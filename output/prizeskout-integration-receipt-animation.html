<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PrizeSkout integration receipt</title>
  <style>
    :root{--coal:#151412;--line:#393530;--paper:#f2eee7;--ink:#24201c;--muted:#8f8880;--orange:#ef681a}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--coal);color:#f5f2ed;font-family:Arial,sans-serif}
    .app{height:100vh;max-width:1080px;margin:auto;display:flex;flex-direction:column}.feed{flex:1;min-height:0;overflow-y:auto;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:4px}.input-bar{flex-shrink:0;padding:18px 28px 28px;display:flex;justify-content:center}
    .concept{width:100%}.eyebrow{display:flex;align-items:center;gap:12px;color:#bcb5ae;font-size:13px}.eyebrow:before{content:"";width:28px;height:1px;background:var(--orange)}h1{max-width:740px;margin:20px 0 44px;font:500 clamp(46px,7vw,78px)/.98 Arial,sans-serif;letter-spacing:-.055em}.frame{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--line);overflow:hidden}.intro{padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}.intro b{font-size:15px;font-weight:500}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .slot{position:relative;min-height:196px;overflow:hidden;background:#0e0e0d}.paper{position:absolute;inset:0;background:var(--paper);color:var(--ink);padding:20px 24px 24px;transform:translateY(-105%)}.paper:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:repeating-linear-gradient(to bottom,transparent 0 7px,var(--coal) 7px 12px)}.running .paper{animation:print .7s cubic-bezier(0,0,.2,1) forwards}.head{padding-bottom:12px;display:flex;justify-content:space-between;border-bottom:1px solid #ccc4b9;color:#746d65;font:500 9px monospace;letter-spacing:.07em;text-transform:uppercase}.logos{padding-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 22px}.logo{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;opacity:0;transform:translateY(5px)}.running .logo{animation:settle .3s calc(.65s + var(--i)*.07s) ease-out forwards}.mark{width:25px;height:25px;display:grid;place-items:center;border-radius:5px;background:var(--c);color:white;font-size:11px;font-weight:700}.rule{position:absolute;inset:auto 24px 13px;width:0;height:2px;background:var(--orange)}.running .rule{animation:rule .45s 1.35s ease-out forwards}
    button{min-height:46px;padding:10px 20px;border:1px solid #8b3b16;border-radius:6px;background:var(--orange);color:white;font-size:13px;font-weight:650;cursor:pointer}.replay{display:none}.done .play{display:none}.done .replay{display:block}
    @keyframes print{to{transform:none}}@keyframes settle{to{opacity:1;transform:none}}@keyframes rule{to{width:calc(100% - 48px)}}
    @media(max-width:700px){.feed{padding:20px}.frame{grid-template-columns:1fr}.intro{padding:18px;gap:8px}.slot{min-height:310px}.logos{grid-template-columns:repeat(2,1fr)}h1{margin-bottom:32px}}
    @media(prefers-reduced-motion:reduce){.paper,.logo,.rule{animation:none!important;transform:none;opacity:1}.rule{width:calc(100% - 48px)}}
  </style>
</head>
<body><main class="app"><div class="feed"><section class="concept"><span class="eyebrow">Deep-tech commerce infrastructure</span><h1>Your commerce stack, read as one record.</h1><div class="frame"><div class="intro"><b>Built around your stack</b><p>Storefronts, POS and delivery platforms—read together.</p></div><div class="slot"><div class="paper"><div class="head"><span>Commerce sources</span><span>PrizeSkout / 08</span></div><div class="logos"><div class="logo" style="--i:0;--c:#7147dc"><i class="mark">Z</i>Zid</div><div class="logo" style="--i:1;--c:#0b837a"><i class="mark">S</i>Salla</div><div class="logo" style="--i:2;--c:#5530bf"><i class="mark">F</i>Foodics</div><div class="logo" style="--i:3;--c:#f35a18"><i class="mark">t</i>Talabat</div><div class="logo" style="--i:4;--c:#df0821"><i class="mark">S</i>Snoonu</div><div class="logo" style="--i:5;--c:#8b6bdc"><i class="mark">J</i>Jahez</div><div class="logo" style="--i:6;--c:#f0c800;color:#111"><i class="mark">K</i>Keeta</div><div class="logo" style="--i:7;--c:#00bfae"><i class="mark">D</i>Deliveroo</div></div><i class="rule"></i></div></div></div></section></div><div class="input-bar"><button class="play">Print the stack</button><button class="replay">Replay</button></div></main>
  <script>const app=document.querySelector('.app'),play=document.querySelector('.play'),replay=document.querySelector('.replay');function run(){app.classList.remove('done');app.classList.add('running');play.disabled=true;setTimeout(()=>{app.classList.add('done');play.disabled=false},1900)}function again(){app.classList.remove('running','done');void app.offsetWidth;run()}play.addEventListener('click',run);replay.addEventListener('click',again);</script>
</body></html>
