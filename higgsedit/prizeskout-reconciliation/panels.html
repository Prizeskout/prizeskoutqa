</style><div id="root"></div><script>
const scene=new URLSearchParams(location.search).get('scene')||location.hash.slice(1)||'orders';
const shell=(body)=>`<div class="app"><aside class="nav"><div class="brand">PrizeSkout</div><small>MONITOR</small><p>Overview<br>Catalog<br>Margin Intelligence<br>Alerts<br><br>Payout Recovery<br>Evidence & History</p></aside><main class="main">${body}</main></div>`;
const head=(e,t,s)=>`<div class="ey">${e}</div><div class="title">${t}</div><div class="sub">${s}</div>`;
if(scene==='orders')root.innerHTML=shell(head('LIVE ORDER INGEST','Orders are arriving now','Every marketplace order is normalized before settlement matching.')+`<div class="metrics"><div class="metric"><label>ORDERS INGESTED</label><b>128</b></div><div class="metric"><label>MATCHED</label><b style="color:#0aa879">126</b></div><div class="metric"><label>NEEDS REVIEW</label><b style="color:#ff641d">2</b></div><div class="metric"><label>CHANNELS</label><b style="color:#2765ff">3</b></div></div><div class="section">RECENT ORDERS</div>`+[['SN-260918-001','Snoonu','QAR 84','Matched'],['SN-260918-002','Snoonu','QAR 126','Review'],['TA-260918-041','Talabat','QAR 73','Matched'],['SN-260918-004','Snoonu','QAR 95','Review'],['ZI-260918-017','Zid','QAR 112','Matched']].map(r=>`<div class="row"><b>${r[0]}</b><span>${r[1]}</span><b>${r[2]}</b><span class="pill ${r[3]=='Matched'?'green':'orange'}">${r[3]}</span></div>`).join(''));
if(scene==='order')root.innerHTML=shell(head('ORDER SN-260918-002','One order. Every deduction explained.','PrizeSkout rebuilds the expected payout from order and contract terms.')+`<div class="cols"><div class="card calc"><h3>EXPECTED PAYOUT</h3>${[['Gross order','QAR 126'],['Customer discount','− QAR 10'],['Platform commission','− QAR 18'],['Delivery fee','− QAR 7']].map(x=>`<div class="line"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div class="total"><span>EXPECTED FROM TERMS</span><b>QAR 91</b></div></div><div class="card settle"><label>SETTLEMENT RECEIVED</label><div class="big">QAR 85</div><label>UNEXPLAINED DIFFERENCE</label><div class="big gap">QAR 6</div><div class="button">OPEN EVIDENCE →</div></div></div>`);
if(scene==='evidence')root.innerHTML=shell(head('EVIDENCE TRACE','The QAR 6 gap is defensible','Order, fee schedule and settlement are linked to the same case.')+`<div class="card evidence">${[['01','Order receipt','Gross order confirmed','QAR 126','#2765ff'],['02','Commission schedule','Contract rate applied','− QAR 18','#8b5cf6'],['03','Delivery fee rule','Merchant-funded fee','− QAR 7','#e7a52d'],['04','Settlement statement','Amount actually paid','QAR 85','#16b887']].map(x=>`<div class="ev"><div class="num" style="background:${x[4]}">${x[0]}</div><div><b>${x[1]}</b><br><span>${x[2]}</span></div><span class="amount">${x[3]}</span><span class="pill green">VERIFIED</span></div>`).join('')}</div>`);
if(scene==='final')root.innerHTML=`<div class="final"><div class="ey">FROM LIVE ORDERS TO RECOVERABLE CASH</div><h1>Catalog synced. Orders matched.<br>Every payout explained.</h1><div class="result"><div><small>CLAIMS READY</small><br><b>QAR 11</b></div><span>2 discrepancies • evidence attached</span></div></div>`;
